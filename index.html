<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>월루해서 회장까지</title>
<style>
* {box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#efefef;
  color:#111;
  font-family:"Malgun Gothic",sans-serif;
}
.app{
  max-width:1180px;
  margin:auto;
  background:#fff;
  border:3px solid #111;
}
header{
  background:#111;
  color:#fff;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.layout{
  display:grid;
  grid-template-columns:1.45fr 0.95fr;
  gap:16px;
  padding:16px;
}
.box{
  border:2px solid #111;
  padding:14px;
  margin-bottom:14px;
  background:#fff;
}
h2{
  margin:0 0 12px;
  font-size:17px;
}
.stats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
  font-size:13px;
}
.stats span{
  border:1px solid #888;
  padding:7px 10px;
}
.scene-box{
  border:2px solid #111;
  padding:10px;
  margin-bottom:14px;
  background:#fff;
}
.scene-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  font-size:13px;
}
#sceneStage{
  width:100%;
  min-height:320px;
  border:2px solid #111;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
}
#sceneStage svg{
  width:100%;
  height:auto;
  display:block;
}
.result{
  border:3px solid #111;
  padding:14px;
  margin-bottom:14px;
  background:#fff;
}
.result strong{
  display:block;
  margin-bottom:7px;
}
.result p{
  margin:0;
  line-height:1.55;
  font-size:14px;
  white-space:pre-line;
}
.bar{
  height:15px;
  border:2px solid #111;
  margin:5px 0 14px;
  background:#fff;
}
.fill{
  height:100%;
  background:#222;
}
.line{
  display:flex;
  justify-content:space-between;
  font-size:13px;
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
button{
  cursor:pointer;
  border:2px solid #111;
  background:#fff;
  padding:11px;
  font-weight:bold;
  color:#111;
  font-family:inherit;
}
button:hover{
  background:#222;
  color:#fff;
}
button:disabled{
  opacity:.35;
  cursor:not-allowed;
}
.messenger{
  border:2px solid #111;
  height:920px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:14px;
  min-width:0;
  background:#fff;
}
.mhead{
  background:#111;
  color:#fff;
  padding:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.messages{
  overflow-y:auto;
  flex:1;
  padding:10px;
  background:#fcfcfc;
}
.message{
  border:1px solid #aaa;
  padding:11px;
  margin-bottom:9px;
  font-size:13px;
  background:#fff;
}
.message.new{
  border:2px solid #111;
  background:#efefef;
}
.message small{
  display:block;
  color:#666;
  margin-bottom:7px;
}
.message p{
  margin:7px 0;
  line-height:1.5;
  white-space:pre-line;
}
.message button{
  width:100%;
  font-size:12px;
}
.mfoot{
  border-top:1px solid #aaa;
  padding:10px;
  font-size:12px;
  background:#fff;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:999;
}
.modal.show{
  display:flex;
}
.dialog{
  width:min(490px,100%);
  background:#fff;
  border:3px solid #111;
  padding:22px;
  box-shadow:7px 7px 0 #444;
}
.dialog p{
  white-space:pre-line;
  line-height:1.65;
}
.dialog button{
  width:100%;
  margin-top:8px;
}
.muted{
  font-size:12px;
  color:#666;
}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  .messenger{position:static;height:460px}
  body{padding:8px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <b>▣ 월루해서 회장까지.exe</b>
    <small>OFFICE IDLE GAME</small>
  </header>

  <div class="layout">
    <div>
      <div class="stats">
        <span id="rank"></span>
        <span id="day"></span>
        <span id="money"></span>
      </div>

      <div class="scene-box">
        <div class="scene-head">

          <span id="sceneSubLabel">평범하게 일하는 중</span>
        </div>
        <div id="sceneStage"></div>
      </div>

      <div class="result" aria-live="polite">
        <strong id="resultTitle">첫 출근</strong>
        <p id="resultText">오늘도 무사히 퇴근할 수 있을까요?</p>
      </div>

      <div class="box">
        <div class="line"><b>체력</b><span id="hpText"></span></div>
        <div class="bar"><div class="fill" id="hpBar"></div></div>

        <div class="line"><b>평판</b><span id="repText"></span></div>
        <div class="bar"><div class="fill" id="repBar"></div></div>

        <div class="line"><b>실적</b><span id="workText"></span></div>
        <div class="bar"><div class="fill" id="workBar"></div></div>
      </div>

      <div class="box">
        <h2>월루하기</h2>
        <div class="buttons" id="actionButtons">
          <button onclick="wolru('sleep')">몰래 자기</button>
          <button onclick="wolru('reels')">릴스 보기</button>
          <button onclick="wolru('coffee')">탕비실 가기</button>
          <button onclick="wolru('toilet')">화장실 피신</button>
        </div>
        <p class="muted" id="cooldown"></p>
      </div>

      <div class="box">
        <h2>승진 심사</h2>
        <p id="promotionInfo"></p>
        <button id="promotionButton" onclick="promote()">승진 도전</button>
      </div>

      <div class="box">
        <button onclick="collection()">엔딩 도감</button>
        <button onclick="restart()">새 인생 시작</button>
      </div>
    </div>

    <aside class="messenger">
      <div class="mhead">
        <b>▤ 사내 메신저</b>
        <span id="pendingCount">새 알림 0</span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="mfoot">사내 알림 · 최신순</div>
    </aside>
  </div>
</div>

<div class="modal" id="modal">
  <div class="dialog">
    <small id="modalType">사내 알림</small>
    <h2 id="modalTitle"></h2>
    <p id="modalBody"></p>
    <div id="modalButtons"></div>
  </div>
</div>

function initial(){
  return {
    rank:0,
    day:1,
    hp:75,
    rep:65,
    work:0,
    money:0,
    sns:0,
    ending:null,
    endings:[],
    pending:[],
    logs:["중소기업 인턴으로 입사했습니다."],
    scene:"office",
    sceneLabel:"사무실",
    sceneSubLabel:"평범하게 일하는 중"
  };
}

let game;
let paused=false;
let cooldownUntil=0;
let ticks=0;
let sceneTimer=null;

const $ = id => document.getElementById(id);
const clamp = n => Math.max(0, Math.min(100, n));

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(game)); }catch(e){}
}

function load(){
  try{
    game = JSON.parse(localStorage.getItem(KEY)) || initial();
    if(!Array.isArray(game.pending)) game.pending = [];
    if(!Array.isArray(game.endings)) game.endings = [];
    if(!Array.isArray(game.logs)) game.logs = [];
    if(!game.scene) game.scene = "office";
    if(!game.sceneLabel) game.sceneLabel = "사무실";
    if(!game.sceneSubLabel) game.sceneSubLabel = "평범하게 일하는 중";
  }catch(e){
    game = initial();
  }
  render();
}

function result(title,text){
  $("resultTitle").textContent = title;
  $("resultText").textContent = text;
}

function log(text){
  game.logs.unshift(text);
  game.logs = game.logs.slice(0,30);
}

function sceneName(scene){
  const map = {
    office:"사무실",
    toilet:"화장실",
    pantry:"탕비실",
    meeting:"회의실"
  };
  return map[scene] || "사무실";
}

function setScene(scene, subLabel=""){
  game.scene = scene || "office";
  game.sceneLabel = sceneName(game.scene);
  if(subLabel) game.sceneSubLabel = subLabel;
  renderScene();
  save();
}

function temporaryScene(scene, subLabel, duration=2800){
  setScene(scene, subLabel);
  if(sceneTimer) clearTimeout(sceneTimer);
  sceneTimer = setTimeout(()=>{
    setScene("office", "평범하게 일하는 중");
  }, duration);
}

function renderScene(){
  $("sceneLabel").textContent = "현재 장소: " + (game.sceneLabel || "사무실");
  $("sceneSubLabel").textContent = game.sceneSubLabel || "";
  $("sceneStage").innerHTML = getSceneSVG(game.scene);
}

function getSceneSVG(scene){
  if(scene === "toilet") return toiletScene();
  if(scene === "pantry") return pantryScene();
  if(scene === "meeting") return meetingScene();
  return officeScene();
}

function render(){
  $("rank").textContent = "직급: " + RANKS[game.rank];
  $("day").textContent = "DAY " + game.day;
  $("money").textContent = game.money.toLocaleString() + "원";

  for(const [key,value] of [["hp",game.hp],["rep",game.rep],["work",game.work]]){
    $(key + "Text").textContent = Math.floor(value) + "/100";
    $(key + "Bar").style.width = clamp(value) + "%";
  }

  const required = 45 + game.rank * 6;
  $("promotionInfo").textContent =
    game.rank === 9
      ? "최종 승진 완료"
      : "다음 직급: " + RANKS[game.rank + 1] + " / 필요 실적 " + required + " / 평판 30 이상";

  $("promotionButton").disabled =
    !!game.ending || paused || game.work < required || game.rep < 30;

  $("pendingCount").textContent = "새 알림 " + game.pending.length;

  document.querySelectorAll("#actionButtons button").forEach(b=>{
    b.disabled = !!game.ending || paused || Date.now() < cooldownUntil;
  });

  $("cooldown").textContent =
    Date.now() < cooldownUntil
      ? "다음 월루까지 " + Math.ceil((cooldownUntil - Date.now()) / 1000) + "초"
      : "";

  renderScene();

  const container = $("messages");
  container.replaceChildren();

  [...game.pending].reverse().forEach(p=>{
    const e = EVENTS[p.index];
    if(!e) return;
    const item = document.createElement("div");
    item.className = "message new";

    const small = document.createElement("small");
    small.textContent = "● 새로운 사건 · DAY " + p.day;

    const strong = document.createElement("strong");
    strong.textContent = e.title;

    const para = document.createElement("p");
    para.textContent = e.body;

    const button = document.createElement("button");
    button.textContent = "확인하고 선택하기 →";
    button.onclick = ()=>openEvent(p.id);

    item.append(small, strong, para, button);
    container.append(item);
  });

  game.logs.slice(0,20).forEach(message=>{
    const item = document.createElement("div");
    item.className = "message";
    const small = document.createElement("small");
    small.textContent = "사내 기록";
    const p = document.createElement("p");
    p.textContent = message;
    item.append(small,p);
    container.append(item);
  });

  save();
}

function modal(title,body,buttons,type="SYSTEM MESSAGE"){
  paused = true;
  $("modal").classList.add("show");
  $("modalType").textContent = type;
  $("modalTitle").textContent = title;
  $("modalBody").textContent = body;
  const wrap = $("modalButtons");
  wrap.replaceChildren();

  buttons.forEach(b=>{
    const button = document.createElement("button");
    button.textContent = b.text;
    button.onclick = b.click;
    wrap.append(button);
  });
}

function closeModal(){
  $("modal").classList.remove("show");
  paused = false;
  render();
}

function endGame(id){
  if(game.ending) return;
  game.ending = id;
  if(!game.endings.includes(id)) game.endings.push(id);
  save();

  const e = ENDINGS[id];
  modal(
    "ENDING — " + e[0],
    e[1] + "\n\n엔딩 " + game.endings.length + "/5 수집",
    [
      {text:"새 인생 시작", click:()=>{ closeModal(); restart(); }},
      {text:"엔딩 도감", click:()=>{ closeModal(); collection(); }}
    ],
    "THE END"
  );
}

function apply(d){
  game.hp = clamp(game.hp + (d.hp || 0));
  game.rep = clamp(game.rep + (d.rep || 0));
  game.work = clamp(game.work + (d.work || 0));
  game.sns += (d.sns || 0);

  const message = d.msg || "별일 없이 지나갔습니다.";
  log(message);
  result("행동 결과", message);

  if(d.scene || d.sceneText){
    temporaryScene(d.scene || "office", d.sceneText || "", 3000);
  }

  if(game.sns >= 8 && Math.random() < 0.15){
    endGame("influencer");
    return;
  }

  if(game.hp <= 0){ endGame("dead"); return; }
  if(game.rep <= 0){ endGame("beggar"); return; }
  if(game.rep >= 95 && game.work >= 80 && game.rank >= 3){
    endGame("scout");
    return;
  }

  render();
}

function wolru(type){
  if(game.ending || paused || Date.now() < cooldownUntil) return;

  const actions = {
    sleep:{name:"몰래 자기",hp:23,risk:.54,penalty:-36,scene:"meeting",sceneText:"몰래 자는 중..."},
    reels:{name:"릴스 보기",hp:12,risk:.43,penalty:-42,scene:"office",sceneText:"모니터 뒤에서 릴스를 보는 중..."},
    coffee:{name:"탕비실 가기",hp:9,risk:.24,penalty:-18,scene:"pantry",sceneText:"탕비실로 도망쳤습니다."},
    toilet:{name:"화장실 피신",hp:16,risk:.37,penalty:-27,scene:"toilet",sceneText:"일단 화장실로 피신했습니다."}
  };

  const a = actions[type];
  cooldownUntil = Date.now() + 18000;

  temporaryScene(a.scene, a.sceneText, 2600);

  const caught = Math.random() < Math.min(.85, a.risk + game.rank * .012);

  if(caught){
    apply({
      hp:-5,
      rep:a.penalty,
      sns:type==="reels"?1:0,
      msg:a.name + " 적발! 체력 -5 / 평판 " + a.penalty
    });
  }else{
    apply({
      hp:a.hp,
      sns:type==="reels"?1:0,
      msg:a.name + " 성공! 체력 +" + a.hp
    });
  }
}

function drawEvent(){
  if(game.ending || game.pending.length >= 3) return;
  const index = Math.floor(Math.random() * EVENTS.length);
  const e = EVENTS[index];
  game.pending.push({
    id: Date.now() + Math.random(),
    index,
    day: game.day
  });
  result("새로운 사내 알림", e.title);
  if(e.scene){
    temporaryScene(e.scene, "새로운 일이 생겼습니다.", 2200);
  }
  render();
}

function chooseOutcome(outcomes){
  const r = Math.random() * 100;
  let sum = 0;
  for(const o of outcomes){
    sum += o.p;
    if(r < sum) return o;
  }
  return outcomes[outcomes.length-1];
}

function openEvent(id){
  if(game.ending || paused) return;
  const pending = game.pending.find(p => p.id === id);
  if(!pending) return;
  const e = EVENTS[pending.index];

  if(e.scene){
    setScene(e.scene, "선택을 기다리는 중");
  }

  modal(
    e.title,
    e.body,
    e.choices.map(c=>({
      text:c.text,
      click:()=>{
        game.pending = game.pending.filter(p=>p.id !== id);
        const outcome = chooseOutcome(c.results);
        apply(outcome);
        if(game.ending) return;
        modal(
          "선택 결과",
          outcome.msg,
          [{text:"확인", click:closeModal}],
          "EVENT RESULT"
        );
      }
    })),
    "사내 메신저"
  );
}

function promote(){
  if(game.ending || paused) return;
  const needed = 45 + game.rank * 6;
  if(game.work < needed || game.rep < 30) return;

  if(Math.random() < .68){
    game.rank++;
    game.work = 0;
    apply({
      rep:5,
      msg:"승진 성공! " + RANKS[game.rank] + "이(가) 되었습니다.",
      scene:"office",
      sceneText:"괜히 더 많은 일을 맡게 될 것 같습니다."
    });
    if(game.rank === 9 && !game.ending){
      endGame("chairman");
    }
  }else{
    apply({
      rep:-13,
      work:-20,
      msg:"승진 누락! 다음 기회에 다시 도전하세요.",
      scene:"office",
      sceneText:"기대하지 말 걸 그랬습니다."
    });
  }
}

function restart(){
  if(!confirm("새 인생을 시작할까요? 엔딩 도감은 유지됩니다.")) return;
  const oldEndings = [...game.endings];
  game = initial();
  game.endings = oldEndings;
  cooldownUntil = 0;
  if(sceneTimer) clearTimeout(sceneTimer);
  $("modal").classList.remove("show");
  paused = false;
  result("재입사","다시 인턴으로 시작합니다.");
  render();
}

function collection(){
  const lines = Object.entries(ENDINGS).map(([id,e],i)=>
    (i+1) + ". " + (game.endings.includes(id) ? e[0] : "???")
  );
  modal("인생 도감", lines.join("\n"), [
    {text:"돌아가기", click:closeModal}
  ], "ENDING COLLECTION");
}

setInterval(()=>{
  if(paused || game.ending) return;
  ticks++;
  game.hp = clamp(game.hp - 0.5);
  game.work = clamp(game.work + 0.3);

  if(ticks % 10 === 0){
    game.day++;
    game.money += 2500 + game.rank * 900;
    log("월급 입금! 또 하루를 버텼습니다.");
  }

  if(game.hp <= 0){
    endGame("dead");
    return;
  }

  if(ticks % 30 === 0){
    drawEvent();
  }else{
    render();
  }
}, 1000);

load();

if(game.ending){
  const previous = game.ending;
  game.ending = null;
  endGame(previous);
}else{
  result("첫 출근","오늘도 무사히 퇴근할 수 있을까요?");
  renderScene();
}
